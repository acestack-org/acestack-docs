services:
  orchestrator:
    container_name: orchestrator
    image: ghcr.io/krinkuto11/acestream-orchestrator:latest
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/docker/config/orchestrator:/app/app/config
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      gluetun:
        condition: service_healthy
    networks:
      - aceserver

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "19000-19099:19000-19099"
      - "8001:8001"
      - "43110:43110"
      - "43111:43111"
      - "5000:5000"
    environment:
      - PGID=1000
      - PUID=1000
      # Esta parte debe ser configurada según tu proveedor de VPN
      # (aquí se usa ProtonVPN con servidor P2P como ejemplo)
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=
      - VPN_PORT_FORWARDING=on
      # Otras configuraciones (se recomienda dejar así)
      - SERVER_COUNTRIES=Spain,France,Germany,Portugal
      - HTTP_CONTROL_SERVER_ADDRESS=:8001
      - DOT=off
      - HEALTH_VPN_DURATION_INITIAL=120s
      - HEALTH_TARGET_ADDRESS=cloudflare.com:80
      - TZ=Europe/Madrid
    restart: unless-stopped
    networks:
      - aceserver
  gluetun2:
    image: qmcgaw/gluetun
    container_name: gluetun_2
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "19100-19199:19100-19199"
      - "8002:8001"
    environment:
      - PGID=1000
      - PUID=1000
      # Esta parte debe ser configurada según tu proveedor de VPN
      # (aquí se usa ProtonVPN con servidor P2P como ejemplo)
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=
      - VPN_PORT_FORWARDING=on
      # Otras configuraciones (se recomienda dejar así)
      - SERVER_COUNTRIES=Spain,France,Germany,Portugal
      - HTTP_CONTROL_SERVER_ADDRESS=:8001
      - DOT=off
      - HEALTH_VPN_DURATION_INITIAL=120s
      - HEALTH_TARGET_ADDRESS=cloudflare.com:80
      - TZ=Europe/Madrid
    restart: unless-stopped
    networks:
      - aceserver

networks:
  aceserver:
    name: aceserver
    driver: bridge
